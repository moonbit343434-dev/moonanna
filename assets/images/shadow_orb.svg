<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="orbGrad" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#E1BEE7;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#CE93D8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9C27B0;stop-opacity:1" />
    </radialGradient>
    <filter id="shadow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <circle cx="50" cy="50" r="35" fill="url(#orbGrad)" filter="url(#shadow)"/>
  <ellipse cx="40" cy="40" rx="15" ry="18" fill="#FFFFFF" opacity="0.4"/>
  <circle cx="60" cy="55" r="8" fill="#7B1FA2" opacity="0.5"/>
</svg>