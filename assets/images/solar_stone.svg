<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="solarGrad" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#FFE0B2;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFCC80;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF9800;stop-opacity:1" />
    </radialGradient>
    <filter id="solarGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <polygon points="50,15 65,35 80,35 90,50 80,65 65,65 50,85 35,65 20,65 10,50 20,35 35,35" 
           fill="url(#solarGrad)" 
           filter="url(#solarGlow)"/>
  <circle cx="50" cy="50" r="20" fill="#FFF3E0" opacity="0.5"/>
  <polygon points="50,30 55,45 50,50 45,45" fill="#FFFFFF" opacity="0.6"/>
</svg>