<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="crystalGrad" cx="50%" cy="30%">
      <stop offset="0%" style="stop-color:#8FDFFF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#4FC3F7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0091EA;stop-opacity:1" />
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <polygon points="50,10 70,30 70,60 50,80 30,60 30,30" 
           fill="url(#crystalGrad)" 
           stroke="#FFFFFF" 
           stroke-width="2" 
           filter="url(#glow)"/>
  <polygon points="50,10 70,30 50,40" fill="#FFFFFF" opacity="0.4"/>
  <polygon points="50,40 70,30 70,60" fill="#0091EA" opacity="0.3"/>
</svg>