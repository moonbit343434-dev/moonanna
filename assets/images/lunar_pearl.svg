<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="pearlGrad" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F5F5F5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0E0E0;stop-opacity:1" />
    </radialGradient>
    <filter id="pearlGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <circle cx="50" cy="50" r="35" fill="url(#pearlGrad)" filter="url(#pearlGlow)"/>
  <ellipse cx="38" cy="38" rx="18" ry="20" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="60" cy="55" r="10" fill="#BDBDBD" opacity="0.3"/>
  <circle cx="42" cy="42" r="8" fill="#FFFFFF" opacity="0.9"/>
</svg>